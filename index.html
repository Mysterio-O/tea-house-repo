<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!-- font awesome cdn -->
    <script src="https://kit.fontawesome.com/fc3f7fcc2f.js" crossorigin="anonymous"></script>
    <!-- manrope font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- tailwind cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                clifford: '#da373d',
              }
            }
          }
        }
      </script>

    <style>
    .manrope-simple {
        font-family: "Manrope", serif;
    }
    </style>
</head>
<body class="manrope-simple">
    <main class="max-w-7xl mx-auto mt-10">
        <section class="lg:flex">
            <div>
                <h1 class="text-5xl md:text-7xl text-[#1c1c1c] font-extrabold leading-[100px]">It's good <br>tea time at The <br> Tea House</h1>
                <p class="font-medium text-base leading-7">Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.</p>
                <button class="p-4 text-xl font-bold text-white leading-7 bg-gradient-to-r from-orange-500 to-red-500 rounded-xl">Explore More <i class="fa-solid fa-arrow-trend-up"></i></button>
            </div>
            <div class="relative">
                <img src="images/banner.png" alt="">
                <div class="flex rounded-xl bg-white items-center gap-2 shadow-xl absolute top-[220px] left-8 md:top-[380px] md:left-36 lg:top-[400px]">
                    <div><i class="fa-solid fa-star text-2xl text-[#ffc850]"></i></div>
                    <div>
                        <h2 class="text-3xl font-bold">5.00</h2>
                        <p class="text-gray-500">Trust Pilot Ratings</p>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
